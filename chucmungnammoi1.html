<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Năm Mới</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #b30000;
            /* Hình nền đỏ họa tiết Tết */
            background-image: url('https://img.freepik.com/free-vector/red-chinese-new-year-background-with-golden-flowers-lanterns_1017-41484.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
        }

        /* --- Canvas Pháo Hoa --- */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Nằm dưới quyển sách */
        }

        /* --- Hiệu ứng Quyển Sách 3D --- */
        .book-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 450px;
            perspective: 1200px; /* Tạo độ sâu 3D */
            z-index: 10;
        }

        .book {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1s;
            cursor: pointer;
        }

        .page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            border-radius: 5px 15px 15px 5px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Trang bên trong (Chứa lời chúc) */
        .inside-page {
            background-color: #fff9e6; /* Màu giấy vàng nhạt */
            background-image: url('https://www.transparenttextures.com/patterns/rice-paper-2.png');
            border: 2px solid #d4af37;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            z-index: 1;
        }

        .inside-page h2 {
            color: #d00000;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .inside-page p {
            color: #333;
            font-size: 1.2rem;
            line-height: 1.6;
            font-weight: bold;
        }

        /* Bìa sách (Mặt ngoài) */
        .cover-page {
            background-color: #d00000;
            background-image: radial-gradient(circle, #e60000 0%, #a30000 100%);
            border: 4px solid #ffd700;
            z-index: 2;
            transform-origin: left center; /* Điểm xoay ở cạnh trái bản lề */
            transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1); /* Hiệu ứng lật mượt mà */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            padding: 20px;
        }

        .cover-page h1 {
            color: #ffd700;
            font-size: 2.8rem;
            text-transform: uppercase;
            text-shadow: 0 0 10px #ffaa00, 0 0 20px #ff0000;
            margin: 0;
            border: 2px solid #ffd700;
            padding: 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.1);
        }

        .click-hint {
            color: #ffffff;
            margin-top: 20px;
            font-style: italic;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
            100% { opacity: 0.5; transform: scale(1); }
        }

        /* Lệnh mở sách (Được kích hoạt qua JavaScript) */
        .book.open .cover-page {
            transform: rotateY(-130deg); /* Mở ra 130 độ */
        }

        @media (max-width: 768px) {
            .book-container { width: 260px; height: 380px; }
            .cover-page h1 { font-size: 2rem; }
            .inside-page h2 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="book-container">
        <div class="book" id="myBook">
            
            <div class="page inside-page">
                <h2>Năm Mới<br>Bình An</h2>
                <p>Mình chúc cô bạn thân<br>Xinh đẹp học giỏi<br>luôn khỏe mạnh<br>Đạt được thành công trong tương lai</p>
            </div>

            <div class="page cover-page">
                <h1>Happy<br>New<br>Year</h1>
                <p class="click-hint">(Click để mở thiệp)</p>
            </div>

        </div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="nhactet.mp3.mp3" type="audio/mpeg">
    </audio>

    <script>
        // --- XỬ LÝ MỞ SÁCH VÀ PHÁT NHẠC ---
        const book = document.getElementById('myBook');
        const bgMusic = document.getElementById('bgMusic');
        bgMusic.volume = 0.8;

        book.addEventListener('click', (e) => {
            // Ngăn chặn sự kiện click lan xuống canvas pháo hoa
            e.stopPropagation();

            // Lật bìa sách
            book.classList.toggle('open');

            // Bật nhạc
            if (bgMusic.paused) {
                bgMusic.play().catch(error => console.log("Lỗi phát nhạc:", error));
            }

            // Bắn một loạt pháo hoa chúc mừng ở giữa màn hình khi mở sách
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    fireworks.push(new Firework(centerX, canvas.height, centerX + (Math.random()*200 - 100), centerY + (Math.random()*200 - 100)));
                }, i * 200);
            }
        });

        // --- XỬ LÝ PHÁO HOA ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 2 + 1;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.velocity = { x: Math.cos(angle) * speed, y: Math.sin(angle) * speed };
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
                this.gravity = 0.04;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
            update() {
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }
        }

        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.speed = 12;
                const angle = Math.atan2(targetY - y, targetX - x);
                this.velocity = { x: Math.cos(angle) * this.speed, y: Math.sin(angle) * this.speed };
                this.particles = [];
                this.exploded = false;
                const colors = ['#ffdf00', '#ffffff', '#00ffcc', '#ff00ff', '#ff6600', '#00ff00'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
            }
            draw() {
                if (!this.exploded) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                }
            }
            update() {
                if (!this.exploded) {
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    const dist = Math.hypot(this.targetX - this.x, this.targetY - this.y);
                    if (dist < this.speed) {
                        this.exploded = true;
                        this.createParticles();
                    }
                } else {
                    for (let i = this.particles.length - 1; i >= 0; i--) {
                        this.particles[i].update();
                        this.particles[i].draw();
                        if (this.particles[i].alpha <= 0) this.particles.splice(i, 1);
                    }
                }
            }
            createParticles() {
                for (let i = 0; i < 120; i++) {
                    this.particles.push(new Particle(this.targetX, this.targetY, this.color));
                }
            }
        }

        const fireworks = [];

        function animate() {
            requestAnimationFrame(animate);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.globalCompositeOperation = 'lighter'; 

            if (Math.random() < 0.03) { 
                const startX = Math.random() * canvas.width;
                const startY = canvas.height;
                const targetX = Math.random() * canvas.width;
                const targetY = Math.random() * canvas.height * 0.6;
                fireworks.push(new Firework(startX, startY, targetX, targetY));
            }

            for (let i = fireworks.length - 1; i >= 0; i--) {
                fireworks[i].update();
                fireworks[i].draw();
                if (fireworks[i].exploded && fireworks[i].particles.length === 0) {
                    fireworks.splice(i, 1);
                }
            }
        }

        // Bắn pháo hoa khi click vào bất kỳ đâu trên màn hình nền
        canvas.addEventListener('click', (e) => {
            if (bgMusic.paused) {
                bgMusic.play().catch(error => console.log("Lỗi phát nhạc:", error));
            }
            const startX = canvas.width / 2;
            const startY = canvas.height;
            const targetX = e.clientX;
            const targetY = e.clientY;
            fireworks.push(new Firework(startX, startY, targetX, targetY));
        });

        animate();
    </script>
</body>
</html>
